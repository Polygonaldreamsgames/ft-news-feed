name: Auto Publish News (Novosibirsk Time)

on:
  schedule:
    # Запускаем КАЖДУЮ МИНУТУ. GitHub работает по UTC!
    - cron: '*/5 * * * *'
  workflow_dispatch: # Кнопка для ручного запуска (для тестов)

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          
      - name: Run Publisher Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/publish_scheduled.py
