name: Auto Publish News V2

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Debug - List files
        run: |
          echo "=== Список файлов ==="
          ls -la
          echo "=== Папка .github ==="
          ls -la .github/
          echo "=== Папка scripts ==="
          ls -la .github/scripts/
          
      - name: Configure Git User
        run: |
          git config --global user.name "Polygonaldreamsgames"
          git config --global user.email "polygonaldreamsgames@users.noreply.github.com"
          
      - name: Run Publisher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/publish_scheduled.py
      - name: Run Publisher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/publish_scheduled.py
