name: Auto Publish News (Novosibirsk Time)

on:
  schedule:
    # Запускаем КАЖДУЮ МИНУТУ по UTC времени
    - cron: '*/5 * * * *'
  workflow_dispatch: # Кнопка для ручного запуска

jobs:
  publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # ✅ Обновил до v4
        
      - name: Setup Python 3.10
        uses: actions/setup-python@v5  # ✅ Обновил до v5
        with:
          python-version: '3.10'
          cache: 'pip'
          
      - name: Verify file exists
        run: |
          echo "Проверяем наличие скрипта..."
          ls -la .github/scripts/
          if [ -f ".github/scripts/publish_scheduled.py" ]; then
            echo "✅ Скрипт найден!"
          else
            echo "❌ Скрипт НЕ найден!"
            exit 1
          fi
          
      - name: Run Publisher Script
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Запускаем скрипт публикации..."
          python .github/scripts/publish_scheduled.py
          echo "Скрипт завершен с кодом: $?"
